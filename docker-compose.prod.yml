services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-whatsappflows}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-whatsappflows}
    volumes:
      - ./whatsappflows_data/db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsappflows} -d ${POSTGRES_DB:-whatsappflows}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: reg-aml.esoko.com/deveops-test.img/whatsappflows-backend:alpha
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV:     production
      DATABASE_URL: postgresql://${POSTGRES_USER:-whatsappflows}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-whatsappflows}?schema=public
      PORT:         3000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.whatsappflows-api.rule=Host(`api.whatsappflows.elicitlabs.link`)"
      - "traefik.http.routers.whatsappflows-api.entrypoints=websecure"
      - "traefik.http.routers.whatsappflows-api.tls.certresolver=myresolver"
      - "traefik.http.services.whatsappflows-api.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
  internal:
